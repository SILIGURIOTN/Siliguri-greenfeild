 "DG1 ACB 1600A":"b_dg1","DG2 ACB 1600A":"b_dg2"
};

function setLed(name,on){
  const e=document.getElementById(leds[name]);
  if(!e)return;
  e.classList.remove("on","off");
  e.classList.add(on?"on":"off");
}
function setBreaker(name,on){
  const e=document.getElementById(breakers[name]);
  if(!e)return;
  e.classList.remove("breakerOn","breakerOff");
  e.classList.add(on?"breakerOn":"breakerOff");
}
function flow(id,on){
  const e=document.getElementById(id);
  if(e)e.classList.toggle("off",!on);
}
function update(){

  Object.keys(leds).forEach(
    n=>setLed(n,!!status[n])
  );

  Object.keys(breakers).forEach(
    n=>setBreaker(n,!!status[n])
  );

  document.getElementById("txt_nc1").textContent =
    status["DG1 NEUTRAL CONTACTOR"]
    ? "● ON"
    : "● OFF";

  document.getElementById("txt_nc2").textContent =
    status["DG2 NEUTRAL CONTACTOR"]
    ? "● ON"
    : "● OFF";

  document.getElementById("txt_20u1").textContent =
    status["20 KVA UPS 1"]
    ? "ONLINE"
    : "OFF";

  document.getElementById("txt_20u2").textContent =
    status["20 KVA UPS 2"]
    ? "ONLINE"
    : "OFF";


  /* ================= INCOMING ================= */

  const incoming =
    status["IC-OG PANEL"] &&
    status["I/C VCB"];

  const og1 =
    incoming &&
    status["O/G VCB 1"];

  /*
    O/G VCB 2 and O/G VCB 3 are allowed OFF.
    They do not block the main incoming power flow.
  */
  const og2 = incoming;
  const og3 = incoming;


  /* ================= TRANSFORMER ================= */

  const tx =
    og1 &&
    status["2000 KVA TRANSFORMER"];


  /* ================= DG ================= */

  const dg1 =
    status["DG1 ISOLATOR"] &&
    status["DG1 NEUTRAL CONTACTOR"] &&
    status["DG1 ACB 1600A"];

  const dg2 =
    status["DG2 ISOLATOR"] &&
    status["DG2 NEUTRAL CONTACTOR"] &&
    status["DG2 ACB 1600A"];


  /* ================= MAIN BUS ================= */

  const main =
    tx ||
    dg1 ||
    dg2;


  /* ================= MLTP OUTGOING ================= */

  const out1 =
    main &&
    status["MLTP OUTGOING 1 ACB 2000A"];

  const out2 =
    main &&
    status["MLTP OUTGOING 2 ACB 2000A"];


  /* ================= MPDB ================= */

  const mpdb =
    out1 ||
    out2;


  /* ================= FLOW ================= */

  flow("flowIncoming",incoming);
  flow("flowIC",incoming);

  flow("flowOG1",og1);
  flow("flowOG2",og2);
  flow("flowOG3",og3);

  flow("flowTX",tx);
  flow("flowTX2",tx);
  flow("flowTXBus",tx);

  flow("flowDG1",dg1);
  flow("flowDG1Bus",dg1);

  flow("flowDG2",dg2);
  flow("flowDG2Bus",dg2);

  flow("flowMain",main);

  flow("flowOut1",out1);
  flow("flowOut2",out2);

  flow("flowMPDB",mpdb);
  flow("flowMPDB1",out1);
  flow("flowMPDB2",out2);


  /* ================= 250 KVA UPS ================= */

  flow(
    "flowUPS2501",
    status["250 KVA UPS 1"] && main
  );

  flow(
    "flowUPS2502",
    status["250 KVA UPS 2"] && main
  );


  /* ================= 20 KVA UPS / SMPS ================= */

  flow(
    "flow20U1",
    status["20 KVA UPS 1"] && mpdb
  );

  flow(
    "flowSM1",
    status["SMPS 1"] && mpdb
  );

  flow(
    "flowSM2",
    status["SMPS 2"] && mpdb
  );

  flow(
    "flowSM3",
    status["SMPS 3"] && mpdb
  );

  flow(
    "flowSM4",
    status["SMPS 4"] && mpdb
  );

  flow(
    "flow20U2",
    status["20 KVA UPS 2"] && mpdb
  );
}

/* ---------------- PAC 1-18 ---------------- */
const pacGroup=document.getElementById("pacGroup");
const pacY=[350,400,450,500,550,600,650,700,750];
for(let i=1;i<=18;i++){
  const left=i<=9;
  const num=left?i:i-9;
  const y=pacY[num-1];
  const x=left?20:1695;
  const w=180;
  const ledX=left?185:1865;
  const textX=left?38:1713;
  const anchor="start";
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.innerHTML=`
    <rect id="pacBox${i}" class="pacCard pacCardOn" x="${x}" y="${y-20}" width="${w}" height="38" rx="5"/>
    <text x="${textX}" y="${y+2}" text-anchor="${anchor}" class="pacText">PAC ${i}</text>
    <circle id="pacLed${i}" cx="${ledX}" cy="${y-3}" r="7" class="pacLed pacOn"/>
    <text id="pacState${i}" x="${ledX-13}" y="${y+2}" text-anchor="end" class="pacStatus" fill="#008f4c">ON</text>
  `;
  pacGroup.appendChild(g);
  status["PAC "+i]=true;
}

function applyPAC(name,on){
  const num=Number(String(name).replace(/\D/g,""));
  if(num<1||num>18)return;
  const led=document.getElementById("pacLed"+num);
  const box=document.getElementById("pacBox"+num);
  const state=document.getElementById("pacState"+num);
  if(led){led.classList.remove("pacOn","pacOff");led.classList.add(on?"pacOn":"pacOff");}
  if(box){box.classList.remove("pacCardOn","pacCardOff");box.classList.add(on?"pacCardOn":"pacCardOff");}
  if(state){state.textContent=on?"ON":"OFF";state.setAttribute("fill",on?"#008f4c":"#d22c3b");}
}

/* ---------------- ThingSpeak ---------------- */
function parseState(v){
  if(v===null||v===undefined||String(v).trim()==="")return null;
  const s=String(v).trim().toUpperCase();
  if(["1","ON","TRUE","YES","RUN","RUNNING","CLOSED","CLOSE","HEALTHY"].includes(s))return true;
  if(["0","OFF","FALSE","NO","STOP","STOPPED","OPEN","FAULT","UNHEALTHY"].includes(s))return false;
  const n=parseFloat(s);
  if(Number.isFinite(n))return n!==0;
  return null;
}
function applyEquipment(name,on){
  if(!name)return;
  if(name.startsWith("PAC ")){status[name]=on;applyPAC(name,on);return;}
  if(Object.prototype.hasOwnProperty.call(status,name))status[name]=on;
}

async function fetchJSON(url){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),8000);
  try{
    const response=await fetch(url,{method:"GET",cache:"no-store",signal:controller.signal});
    if(!response.ok)throw new Error("HTTP "+response.status);
    return await response.json();
  }finally{clearTimeout(timer);}
}

async function readChannel(ch){
  if(!ch.id || ch.id.includes("CHANNEL_"))return {configured:false};
  let url=`https://api.thingspeak.com/channels/${encodeURIComponent(ch.id)}/feeds/last.json?_=${Date.now()}`;
  if(ch.key)url+=`&api_key=${encodeURIComponent(ch.key)}`;
  const data=await fetchJSON(url);
  let changed=0;
  Object.entries(ch.map||{}).forEach(([field,equipment])=>{
    const value=data[field];
    const on=parseState(value);
    if(on!==null){applyEquipment(equipment,on);changed++;}
  });
  return {configured:true,changed,data};
}

async function updateThingSpeak(){
  const configured=THINGSPEAK.channels.filter(c=>c.id && !c.id.includes("CHANNEL_"));
  if(!configured.length){
    setTSStatus("OFFLINE","NO CHANNEL ID");
    return;
  }
  const results=await Promise.allSettled(configured.map(readChannel));
  const ok=results.filter(r=>r.status==="fulfilled" && r.value.configured).length;
  const changed=results.reduce((n,r)=>n+(r.status==="fulfilled"?(r.value.changed||0):0),0);
  if(ok===configured.length && changed>0)setTSStatus("LIVE",`ONLINE • ${changed} VALUES`);
  else if(ok>0)setTSStatus("PARTIAL",`THINGSPEAK CONNECTED • ${changed} VALUES`);
  else setTSStatus("OFFLINE","THINGSPEAK OFFLINE");
  update();
}
function setTSStatus(mode,text){

  const el=document.getElementById("tsStatus");
  const panel=document.getElementById("panelStatusText");

  if(mode==="LIVE"){

    el.className="online tsLive";
    el.innerHTML="<i></i>ONLINE";

    panel.textContent="PANEL ONLINE";
    panel.style.fill="#00a85a";

  }else{

    el.className="online tsFail";
    el.innerHTML="<i></i>I-OFLINE";

    panel.textContent="PANEL OFFLINE";
    panel.style.fill="#d22c3b";
  }
}
